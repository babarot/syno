version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    # Windows is left out: discover reads the ARP table only on macOS and
    # Linux
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # The version itself is a constant tagpr keeps current, so that
    # go install builds report it too
    ldflags:
      - -s -w
      - -X github.com/babarot/syno/internal/version.Source=release
    main: .
    flags:
      - -trimpath

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}
    # The default files, and the agent skill for the Nix package to install
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - skills/**/*

# tagpr writes the release notes
changelog:
  disable: true

release:
  prerelease: auto
  draft: false

nix:
  - repository:
      owner: babarot
      name: nur-packages
      token: "{{ .Env.NUR_GITHUB_TOKEN }}"
    homepage: https://github.com/babarot/syno
    description: Find the Synology NAS on your network and check on it from the terminal
    license: mit
    main_program: syno
    # The skill goes where tools put theirs, so that a Home Manager setup
    # can link it with the binary of the same release
    extra_install: |-
      mkdir -p $out/share/skills
      cp -r skills/syno $out/share/skills/syno
